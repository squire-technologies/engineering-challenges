server.port=${PORT:3000}
spring.web.error.include-message=always

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/salon}
spring.datasource.username=${DATABASE_USER:salon}
spring.datasource.password=${DATABASE_PASSWORD:salon}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
