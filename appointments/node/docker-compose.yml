services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - salon-pgdata:/var/lib/postgresql/data

volumes:
  salon-pgdata:
